<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#102d37">
    <title>Market Structure · Research workspace</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Workspace navigation">
        <a class="brand" href="#/" aria-label="Market Structure overview"><span class="brand-mark" aria-hidden="true">m</span><span>Market<br><strong>Structure</strong></span></a>
        <div class="workspace-label">RESEARCH WORKSPACE</div>
        <nav id="navigation" aria-label="Portal"></nav>
        <div class="sidebar-foot"><span class="status-dot" aria-hidden="true"></span><div>Snapshot workspace<small>No verified refresh connection</small></div></div>
      </aside>
      <div class="main-shell">
        <header class="topbar"><div class="breadcrumb">Market Structure <span aria-hidden="true">/</span> <span id="route-label">Overview</span></div><button id="reload" class="button button-quiet" type="button"><span aria-hidden="true">↻</span> Reload snapshot</button></header>
        <div id="snapshot-banner" class="snapshot-banner" role="status">Loading the research snapshot…</div>
        <main id="main" tabindex="-1"><div class="loading-state">Loading your workspace…</div></main>
        <footer class="page-footer"><span>MARKET STRUCTURE</span><span>Observation dates accompany all data. Comparisons use complete monthly periods.</span></footer>
      </div>
    </div>
    <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
  </body>
</html>
